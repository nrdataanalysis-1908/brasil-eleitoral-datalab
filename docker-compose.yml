services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./catalog:/app/catalog:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./catalog:/app/catalog:ro
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
