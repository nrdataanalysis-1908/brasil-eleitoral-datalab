name: API CI
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run API tests
        working-directory: services/api
        run: npm test
